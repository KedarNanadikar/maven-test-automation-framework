name: 🚀 CI - Test Automation Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [8, 11, 17]
        exclude:
          # Exclude some combinations to reduce CI time
          - os: macos-latest
            java: 8
          - os: windows-latest
            java: 17

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'

    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🔧 Install Chrome (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: 🔧 Install Playwright Browsers
      run: |
        mvn exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps chromium firefox webkit"

    - name: 🏗️ Compile Tests
      run: mvn clean compile test-compile

    - name: 🧪 Run Selenium Tests
      run: mvn test -Dtest=SeleniumIntegrationTest -Dmaven.test.failure.ignore=true
      continue-on-error: true

    - name: 🎭 Run Playwright Tests  
      run: mvn test -Dtest=ImprovedPlaywrightTests -Dmaven.test.failure.ignore=true
      continue-on-error: true

    - name: 🌐 Run DemoQA Tests
      run: mvn test -Dtest=DemoQATests -Dmaven.test.failure.ignore=true
      continue-on-error: true

    - name: 📊 Generate Test Reports
      if: always()
      run: mvn surefire-report:report site -DgenerateReports=false

    - name: 📤 Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-reports-${{ matrix.os }}-java${{ matrix.java }}
        path: |
          target/surefire-reports/
          test-reports/
          target/site/
        retention-days: 30

    - name: 📤 Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: screenshots-${{ matrix.os }}-java${{ matrix.java }}
        path: test-reports/screenshots/
        retention-days: 7

    - name: 📋 Publish Test Results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Maven Tests (${{ matrix.os }}, Java ${{ matrix.java }})
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true

  code-quality:
    name: 🔍 Code Quality Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: ☕ Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'

    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🏗️ Build and analyze
      run: mvn clean verify

    # Future: Add SonarQube analysis
    # - name: 🔍 SonarQube Analysis
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    #   run: mvn sonar:sonar

  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🔒 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📤 Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  performance-test:
    name: ⚡ Performance Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'

    - name: 🔧 Install Playwright Browsers
      run: |
        mvn exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps chromium"

    - name: ⚡ Run Performance Tests
      run: mvn test -Dtest=*Performance* -Dmaven.test.failure.ignore=true
      continue-on-error: true

    - name: 📊 Upload Performance Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: test-reports/
        retention-days: 30

  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [test, code-quality, security-scan]
    if: always()

    steps:
    - name: 📢 Notify Success
      if: ${{ needs.test.result == 'success' && needs.code-quality.result == 'success' }}
      run: |
        echo "✅ All tests passed successfully!"
        echo "🎉 Ready for merge to main branch"

    - name: 📢 Notify Failure
      if: ${{ needs.test.result == 'failure' || needs.code-quality.result == 'failure' }}
      run: |
        echo "❌ Tests failed or quality checks failed"
        echo "🔍 Check the logs and fix issues before merging"