name: 🚀 Release & Deployment

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string

jobs:
  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: ☕ Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'

    - name: 📦 Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: 🔢 Generate Version Number
      id: version
      run: |
        if [[ "${{ github.event.inputs.version }}" != "" ]]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          # Auto-generate version based on date and run number
          DATE=$(date +%Y.%m.%d)
          VERSION="v${DATE}.${GITHUB_RUN_NUMBER}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: 🏗️ Build and Package
      run: |
        mvn clean package -DskipTests
        mvn clean compile test-compile

    - name: 🧪 Run Full Test Suite
      run: |
        mvn test -Dmaven.test.failure.ignore=true
        mvn surefire-report:report

    - name: 📊 Generate Documentation
      run: |
        mvn javadoc:javadoc
        mvn site

    - name: 📦 Create Release Archive
      run: |
        mkdir -p release-artifacts
        
        # Copy main artifacts
        cp target/*.jar release-artifacts/ 2>/dev/null || echo "No JAR files found"
        cp -r target/site release-artifacts/documentation/ 2>/dev/null || echo "No site documentation found"
        cp -r test-reports release-artifacts/ 2>/dev/null || echo "No test reports found"
        
        # Create source archive
        git archive --format=zip --prefix=maven-test-automation-framework/ HEAD > release-artifacts/source-code.zip
        
        # Create README for release
        cat > release-artifacts/README.md << 'EOF'
        # 🚀 Maven Test Automation Framework Release
        
        ## 📦 Contents
        - `source-code.zip` - Complete source code
        - `documentation/` - JavaDoc and site documentation  
        - `test-reports/` - Latest test execution reports
        - JAR files (if applicable)
        
        ## 🚀 Quick Start
        1. Extract `source-code.zip`
        2. Run `mvn clean test` to execute all tests
        3. View reports in `test-reports/` directory
        
        ## 📋 Requirements
        - Java 8+
        - Maven 3.6+
        - Chrome browser for Selenium tests
        
        ## 🔗 Links
        - [GitHub Repository](https://github.com/${{ github.repository }})
        - [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)
        - [Issues](https://github.com/${{ github.repository }}/issues)
        EOF

    - name: 🏷️ Create Git Tag
      if: github.event.inputs.version != ''
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git tag -a ${{ steps.version.outputs.version }} -m "Release ${{ steps.version.outputs.version }}"
        git push origin ${{ steps.version.outputs.version }}

    - name: 📝 Generate Release Notes
      id: release_notes
      run: |
        if [[ "${{ github.event.inputs.release_notes }}" != "" ]]; then
          RELEASE_NOTES="${{ github.event.inputs.release_notes }}"
        else
          # Auto-generate release notes from commits
          RELEASE_NOTES="## 🚀 What's New in ${{ steps.version.outputs.version }}

        ### ✨ Features & Improvements
        $(git log --oneline --pretty=format:"- %s" HEAD~10..HEAD | head -10)

        ### 🧪 Test Results
        - ✅ Selenium WebDriver tests passing
        - ✅ Playwright tests passing  
        - ✅ DemoQA integration tests passing
        - ✅ Cross-platform compatibility verified

        ### 📊 Technical Details
        - **Build Number**: ${{ github.run_number }}
        - **Commit SHA**: ${{ github.sha }}
        - **Java Version**: 8, 11, 17 compatible
        - **Maven Version**: 3.6+

        ### 🔗 Links
        - [📖 Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)
        - [🐛 Report Issues](https://github.com/${{ github.repository }}/issues)
        - [💬 Discussions](https://github.com/${{ github.repository }}/discussions)"
        fi
        
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        echo "$RELEASE_NOTES" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: 🚀 Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: 🚀 Test Automation Framework ${{ steps.version.outputs.version }}
        body: ${{ env.RELEASE_NOTES }}
        draft: false
        prerelease: false

    - name: 📤 Upload Release Assets
      run: |
        for file in release-artifacts/*; do
          if [[ -f "$file" ]]; then
            filename=$(basename "$file")
            curl -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }}/assets?name=$filename"
          fi
        done

  deploy-documentation:
    name: 📚 Deploy Documentation  
    runs-on: ubuntu-latest
    needs: create-release
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: 11
        distribution: 'temurin'

    - name: 📖 Generate Documentation Site
      run: |
        mvn clean javadoc:javadoc site
        
        # Create enhanced documentation structure
        mkdir -p docs
        cp -r target/site/* docs/
        
        # Add custom styling and navigation
        cat > docs/index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>🚀 Maven Test Automation Framework</title>
            <style>
                body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; }
                .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; border-radius: 10px; }
                .nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin: 2rem 0; }
                .card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 1.5rem; }
                .card h3 { margin-top: 0; color: #495057; }
                .button { display: inline-block; background: #007bff; color: white; padding: 0.5rem 1rem; text-decoration: none; border-radius: 5px; }
            </style>
        </head>
        <body>
            <div class="header">
                <h1>🚀 Maven Test Automation Framework</h1>
                <p>Comprehensive documentation for modern web testing with Selenium & Playwright</p>
            </div>
            
            <div class="nav">
                <div class="card">
                    <h3>📖 API Documentation</h3>
                    <p>JavaDoc documentation for all classes and methods</p>
                    <a href="apidocs/index.html" class="button">View JavaDocs</a>
                </div>
                
                <div class="card">
                    <h3>📊 Test Reports</h3>
                    <p>Latest test execution results and coverage</p>
                    <a href="surefire-report.html" class="button">View Reports</a>
                </div>
                
                <div class="card">
                    <h3>🔗 GitHub Repository</h3>
                    <p>Source code, issues, and contributions</p>
                    <a href="https://github.com/${{ github.repository }}" class="button">Visit GitHub</a>
                </div>
                
                <div class="card">
                    <h3>🚀 Quick Start</h3>
                    <p>Get started with the framework in minutes</p>
                    <a href="https://github.com/${{ github.repository }}#setup-instructions" class="button">Get Started</a>
                </div>
            </div>
        </body>
        </html>
        EOF

    - name: 🚀 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs
        cname: # Add your custom domain here if needed

  notify-release:
    name: 📢 Release Notifications
    runs-on: ubuntu-latest
    needs: [create-release, deploy-documentation]

    steps:
    - name: 📧 Create Release Announcement
      run: |
        echo "## 🎉 New Release Available!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version**: ${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Release ID**: ${{ needs.create-release.outputs.release_id }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Quick Links:" >> $GITHUB_STEP_SUMMARY
        echo "- [📦 Download Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
        echo "- [📚 Documentation](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }})" >> $GITHUB_STEP_SUMMARY
        echo "- [🚀 Quick Start Guide](https://github.com/${{ github.repository }}#setup-instructions)" >> $GITHUB_STEP_SUMMARY

    - name: 🐦 Tweet Release (Optional)
      if: env.TWITTER_API_KEY != ''
      run: |
        # Add Twitter API integration here if needed
        echo "🐦 Tweet about the release (requires Twitter API configuration)"